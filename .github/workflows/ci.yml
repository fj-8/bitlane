name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A new push to a branch supersedes the run before it, so the older one is
# cancelled instead of queueing. A run on main is never cancelled: main is the
# release, and its history is the evidence the READMEs point at.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  headers:
    name: Every header compiles alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: One translation unit per header
        run: |
          set -euo pipefail
          for f in include/bitlane/*.hpp; do
            printf '#include <%s>\nint main() { return 0; }\n' "bitlane/$(basename "$f")" > /tmp/probe.cpp
            echo "--- $f"
            g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Iinclude -fsyntax-only /tmp/probe.cpp
          done

  test:
    name: ${{ matrix.name }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            os: ubuntu-latest
            generator: Ninja
            cc: gcc
            cxx: g++
          - name: Clang
            os: ubuntu-latest
            generator: Ninja
            cc: clang
            cxx: clang++
          - name: Apple Clang
            os: macos-latest
            generator: Ninja
            cc: clang
            cxx: clang++
          - name: MSVC
            os: windows-latest
            cc: ""
            cxx: ""
    steps:
      - uses: actions/checkout@v7
      # The Visual Studio leg gets no -G: the Windows image ships a newer
      # instance than any version this file could name at write time, and
      # CMake's default generator on that runner is the installed one. A
      # multi-config generator takes its configuration at build time, so
      # CMAKE_BUILD_TYPE would be silently ignored here.
      - name: Configure (Visual Studio)
        if: matrix.cc == ''
        run: cmake -S . -B build -A x64
      - name: Configure (Ninja)
        if: matrix.cc != ''
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        # -Werror here for the same reason the /WX leg exists on MSVC: the
        # compilers disagree, and this repository's own harness bug was found by
        # a GCC diagnostic that MSVC stayed silent about.
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release
             -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
      - name: Build (Visual Studio)
        if: matrix.cc == ''
        run: cmake --build build --config Release
      - name: Test (Visual Studio)
        if: matrix.cc == ''
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Build
        if: matrix.cc != ''
        run: cmake --build build
      - name: Test
        if: matrix.cc != ''
        run: ctest --test-dir build --output-on-failure
      - name: Examples
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ matrix.cc }}" ]; then
            cmake --build build --config Release \
              --target example_posting_index example_tag_query
          else
            cmake --build build --target example_posting_index example_tag_query
          fi
          for wanted in example_posting_index example_tag_query; do
            # A bare "$wanted*" also matches the Visual Studio generator's
            # .vcxproj, which is XML, not something a shell can run.
            exe=$(find build -maxdepth 2 \
                      \( -name "$wanted*.exe" -o -name "$wanted" \) -type f | head -n1)
            if [ -z "$exe" ]; then
              echo "no $wanted binary under build/" >&2
              exit 1
            fi
            echo "--- $exe"
            "./$exe"
          done

  sanitizers:
    name: ASan and UBSan over the suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Debug rather than Release: the sanitizers instrument what is allocated and
      # what is read, and an inlined Release build hides the frame the report
      # needs. -O1 keeps the run short enough to be worth the queue.
      - name: Configure with -fsanitize=address,undefined
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  strict-msvc:
    name: Zero warnings (/W4 /WX)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure with /WX
        run: cmake -S . -B build -A x64 -DCMAKE_CXX_FLAGS="/WX /utf-8"
      - name: Build everything, including the benchmark
        run: cmake --build build --config Release

  package:
    name: Installed package is usable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure, build and install
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cmake --install build --prefix /tmp/bitlane-prefix
      - name: Build an unrelated consumer project
        run: |
          set -euo pipefail
          mkdir -p /tmp/consumer
          cat > /tmp/consumer/CMakeLists.txt <<'EOS'
          cmake_minimum_required(VERSION 3.21)
          project(consumer CXX)
          find_package(bitlane 0.4 CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE bitlane::bitlane)
          EOS
          cat > /tmp/consumer/main.cpp <<'EOS'
          #include <bitlane/bitlane.hpp>
          #include <cstdio>
          int main() {
              bitlane::bitmap b;
              b.insert_range(1, 9);
              const auto wire = b.encode();
              const auto back = bitlane::bitmap::decode(wire);
              std::printf("card=%zu\n", b.cardinality());
              return (b.cardinality() == 9 && back && *back == b) ? 0 : 1;
          }
          EOS
          cmake -S /tmp/consumer -B /tmp/consumer/build -G Ninja \
                -DCMAKE_PREFIX_PATH=/tmp/bitlane-prefix -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/consumer/build
          /tmp/consumer/build/consumer
